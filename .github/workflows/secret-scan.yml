name: secret-scan

# The rule "no secrets in this repo" is enforced here rather than remembered.
# Decided on xcp-hl#70. A finding means rotate and rewrite, never allowlist.
on:
  push:
  pull_request:

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: a secret removed from the tip still lives in history.
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
