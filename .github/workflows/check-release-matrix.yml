name: Check release matrix
on:
  pull_request:
    paths: ['docs/_data/**', 'docs/_includes/release-matrix-*.html', 'docs/_includes/generated-changelog.html', 'docs/**/release-matrix.md', 'docs/**/changelog.md', 'ci/check-release-matrix.py', 'ci/check-changelog.py', '.github/workflows/check-release-matrix.yml']
  push:
    branches: [main]
    paths: ['docs/_data/**', 'docs/_includes/release-matrix-*.html', 'docs/_includes/generated-changelog.html', 'docs/**/release-matrix.md', 'docs/**/changelog.md', 'ci/check-release-matrix.py', 'ci/check-changelog.py', '.github/workflows/check-release-matrix.yml']
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python ci/check-release-matrix.py
      - run: python ci/check-changelog.py
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
          working-directory: docs
      - name: Render production documentation
        working-directory: docs
        run: bundle exec jekyll build -s . -d ../_matrix_site
      - run: python ci/check-release-matrix.py --site _matrix_site
      - run: python ci/check-changelog.py --site _matrix_site
      - uses: actions/upload-artifact@v4
        with:
          name: release-matrix-site
          path: _matrix_site
