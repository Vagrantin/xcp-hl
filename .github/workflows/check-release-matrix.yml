name: Check release matrix
# Data validation only. The EN/FR/JA rendered release-matrix and changelog
# pages are built with Hugo and validated with both --site checkers in
# docs-hugo.yml; the Jekyll render this workflow used to validate was retired
# with the docs/ source tree (owner decision 2026-11-11, site/CUTOVER.md).
on:
  pull_request:
    paths: ['docs/_data/**', 'ci/check-release-matrix.py', 'ci/check-changelog.py', '.github/workflows/check-release-matrix.yml']
  push:
    branches: [main]
    paths: ['docs/_data/**', 'ci/check-release-matrix.py', 'ci/check-changelog.py', '.github/workflows/check-release-matrix.yml']
permissions:
  contents: read
jobs:
  matrix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PyYAML==6.0.3
      - run: python ci/check-release-matrix.py
      - run: python ci/check-changelog.py
