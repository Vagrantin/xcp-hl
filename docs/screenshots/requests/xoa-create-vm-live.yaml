id: xoa-create-vm-live
docPage: site/content/en/docs/xoa-hl/create-vm.md
target: xoa
mode: live
locales: [en, fr, ja]
authenticate: true
fixture: beginner
steps:
  - goto: /#/srs/{{isoSrUuid}}/disks
  - waitFor: {selector: table}
  - waitFor: {text: '{{isoName}}'}
  - screenshot: {name: installer-iso, element: {selector: table}}
  - goto: /#/vms/new?pool={{poolUuid}}&template={{poolUuid}}-{{templateUuid}}
  - waitFor: {selector: 'form#vmCreation'}
  - waitFor: {selector: '.Select-value-label', textSuffix: '{{templateName}} - {{poolName}}'}
  - screenshot: {name: new-vm, viewport: {width: 1920, height: 2200}, element: {selector: 'form#vmCreation'}}
  - goto: /#/vms/{{vmUuid}}/console
  - waitFor: {selector: canvas, renderedCanvas: true}
  - waitFor: {text: '{{vmName}}'}
  - screenshot: {name: guest-console, viewport: {width: 1920, height: 1280}, fullPage: true}
  - goto: /#/vms/{{vmUuid}}/disks
  - waitFor: {selector: table}
  - waitFor: {text: '{{vmName}}'}
  - screenshot: {name: guest-disks, viewport: {width: 1920, height: 800}, element: {selector: table}}
